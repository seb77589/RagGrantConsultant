[project]
name = "gcr"
version = "0.1.0"
description = "Pan-European, English-only grant consultant: retrieval-augmented question answering over official EU funding sources"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "typer>=0.15",
]

[project.optional-dependencies]
# The real bge-m3 tokenizer, without the GPU stack. Chunk boundaries depend on
# it: the character fallback over-estimates by ~17% and so builds a different
# corpus. transformers pulls in `tokenizers` but not torch, so this stays small
# enough to belong in every image that builds sections.
tokenize = [
    "transformers>=4.44",
]
# The HTTP endpoint. Small, and separate from the ingestion path so the pipeline
# image does not carry a web framework it never serves.
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]
# Heavy GPU stack, installed separately: uv sync --extra embed
embed = [
    "torch>=2.4",
    "transformers>=4.44",
    "FlagEmbedding>=1.3",
]

[project.scripts]
gcr = "gcr.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gcr"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Explicit so lint results do not drift with ruff's default set.
select = ["E", "F", "W", "I", "B", "C4", "UP", "DTZ", "SIM", "RUF", "BLE", "PL"]
ignore = [
    "PLR0912",  # branch count: the metadata sentence builder is a flat series of optional fields
    "PLR2004",  # magic values: token budgets and column counts read better inline
    "PLC0415",  # deferred imports are deliberate: the GPU stack must stay optional
    "PLR0913",  # argument count: typer commands and the download API are keyword-heavy
    "PLR0917",  # positional argument count: same reason
]

[tool.pytest.ini_options]
testpaths = ["tests"]
