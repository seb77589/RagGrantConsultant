# Containerised runtime for the grant consultant stack.
#
# Nothing here is installed on the host: the engine (Docker 29.1.3), Compose
# and the NVIDIA Container Toolkit were already present, and everything else
# runs as a container. See docs/containerisation-plan.md.
#
# Image pins are literal rather than variables so that the versions actually
# in use are under version control. Profiles keep the GPU tier off when only
# the database is wanted:
#
#   docker compose --profile core up -d                 # database only
#   docker compose run --rm pipeline gcr sections horizon
#   docker compose --profile core --profile models \
#                  --profile auth --profile edge up -d  # the whole stack
#
# Services are added to this file as their phase in the plan is validated,
# so everything present here has been proven to come up.

name: gcr

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  # ---------------------------------------------------------------------
  # PostgreSQL + pgvector (plan phase 2)
  # ---------------------------------------------------------------------
  db:
    image: pgvector/pgvector:0.8.6-pg18-trixie
    # pgvector 0.8.6. Do not drop below 0.8.4 on PG18: 0.8.3 fixed HNSW index
    # corruption during vacuum and 0.8.4 fixed errors on concurrent inserts
    # during one. A corpus that gets re-ingested cannot do without either.
    profiles: ["core"]
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
      # Checksums cost a little write throughput and make corruption visible
      # instead of silent, which matters for the migration-equivalence proof.
      POSTGRES_INITDB_ARGS: "--data-checksums"
      # Consumed by 00-authelia-db.sh at first initialisation only.
      AUTHELIA_DB_NAME: ${AUTHELIA_DB_NAME:-authelia}
      AUTHELIA_DB_USER: ${AUTHELIA_DB_USER:-authelia}
      AUTHELIA_DB_PASSWORD: ${AUTHELIA_DB_PASSWORD:?set in .env}
      TZ: ${TZ:-Etc/UTC}
    # Docker gives a container 64 MB of /dev/shm by default. PostgreSQL puts
    # parallel workers' shared memory there, so a parallel HNSW build over
    # 50,000 1024-dimension vectors dies with
    #   DiskFull: could not resize shared memory segment ... to 2144407072 bytes
    # which names the wrong resource entirely -- the disk has 370 GB free. The
    # build wants a little over 2 GB, so this leaves headroom for a larger
    # corpus and for raising maintenance_work_mem.
    shm_size: 4gb
    volumes:
      # The PG18 image sets PGDATA=/var/lib/postgresql/18/docker and declares
      # its VOLUME at /var/lib/postgresql -- NOT the /var/lib/postgresql/data
      # that older examples use. Mounting the old path persists nothing: the
      # real data would land in an anonymous volume instead.
      - pgdata:/var/lib/postgresql
      - ./containers/db/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      # Loopback only, for psql and inspection during development. Services
      # reach the database as db:5432 over the compose network and never use
      # this. Comment the block out to close it entirely.
      - "${POSTGRES_HOST_PORT:-127.0.0.1:5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - backend

  # ---------------------------------------------------------------------
  # Ingestion pipeline (plan phase 3). Run-on-demand, not a long-lived
  # service -- it has no server to keep up:
  #
  #   docker compose run --rm pipeline gcr sections horizon
  #   docker compose run --rm --entrypoint pytest pipeline -q
  #
  # PIPELINE_TARGET=embed switches to the CUDA build for the embedding pass.
  # ---------------------------------------------------------------------
  pipeline:
    build:
      context: .
      dockerfile: containers/pipeline/Containerfile
      target: ${PIPELINE_TARGET:-base}
      args:
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    image: gcr-pipeline:${PIPELINE_TARGET:-base}
    profiles: ["tools"]
    logging: *default-logging
    environment:
      # The in-network form. config.py defaults to the published loopback port
      # instead, so a host-side `uv run` needs no setup.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      HF_HOME: /opt/hf
      TZ: ${TZ:-Etc/UTC}
    volumes:
      # Must be /app/data, not /data: config.py derives paths from REPO_ROOT
      # (= /app) and fetch.py stores them relative to it, raising ValueError
      # for any destination outside it.
      - ./data:/app/data
      # Live code, so an edit on the host takes effect without a rebuild. The
      # editable install points at /app/src, so this shadows it correctly.
      - ./src:/app/src
      - ./tests:/app/tests
      # Shared with the model servers, so bge-m3 is downloaded once.
      - hf_cache:/opt/hf
    networks:
      - backend
    # No depends_on: fetch, sections, manifest, pytest and ruff need no
    # database, and naming a dependency in another profile would force the
    # `core` profile on for all of them.
    deploy:
      resources:
        reservations:
          devices:
            # `capabilities` is required alongside `driver: cdi` -- Compose
            # rejects the reservation without it. Harmless on the CPU-only
            # base target; needed by the embed target.
            - driver: cdi
              capabilities: ["gpu"]
              device_ids: ["nvidia.com/gpu=0"]

  # ---------------------------------------------------------------------
  # Model serving (plan phase 5). Three containers share the one GPU; the
  # driver time-slices between them. VRAM is summed, not shared, so the
  # budget is the binding constraint -- see risk R2 in the plan.
  # ---------------------------------------------------------------------

  # Dense embeddings for the vector half of hybrid retrieval.
  tei-embed:
    image: ghcr.io/huggingface/text-embeddings-inference:86-1.9.4
    # `86` is the Ampere sm_86 build, which is what an RTX 3080 Laptop is.
    profiles: ["models"]
    restart: unless-stopped
    logging: *default-logging
    command:
      - "--model-id=${EMBED_MODEL_ID:-BAAI/bge-m3}"
      # bge-m3 is CLS-pooled. TEI should infer this from 1_Pooling/config.json,
      # but it is stated explicitly because a silent fall-through to mean
      # pooling degrades retrieval in a way that merely looks like a weak model
      # -- the kind of failure that gets blamed on the corpus for weeks.
      - "--pooling=cls"
      # Chunks are capped at 512 tokens (MAX_TOKENS), far below bge-m3's 8192.
      - "--max-client-batch-size=64"
      - "--auto-truncate"
    environment:
      HUGGINGFACE_HUB_CACHE: /data
      TZ: ${TZ:-Etc/UTC}
    volumes:
      # Same cache as the pipeline, so bge-m3 is downloaded once and the
      # weights used for indexing are literally the weights used for queries.
      - hf_cache:/data
    networks:
      - backend
    healthcheck:
      # TEI listens on 80 inside the container, not 8080. `curl` is present in
      # this image (wget and python3 are not), and hitting /health proves the
      # model is actually serving -- a `--help` probe would pass while the
      # weights were still downloading.
      test: ["CMD", "curl", "-fsS", "http://localhost:80/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      # Weight download plus load. Too short and compose tears the stack down
      # during the very first pull -- see risk R5.
      start_period: 300s
    deploy:
      resources:
        reservations:
          devices:
            - driver: cdi
              capabilities: ["gpu"]
              device_ids: ["nvidia.com/gpu=0"]

  # Reranking, applied to the merged keyword+vector candidates before the top
  # 6-10 sections reach the generation context.
  tei-rerank:
    image: ghcr.io/huggingface/text-embeddings-inference:86-1.9.4
    profiles: ["models"]
    restart: unless-stopped
    logging: *default-logging
    command:
      - "--model-id=${RERANK_MODEL_ID:-BAAI/bge-reranker-v2-m3}"
      # Rerank batches are small and bounded (a few dozen candidates), so this
      # is kept low to leave VRAM for generation.
      - "--max-client-batch-size=32"
      - "--auto-truncate"
    environment:
      HUGGINGFACE_HUB_CACHE: /data
      TZ: ${TZ:-Etc/UTC}
    volumes:
      - hf_cache:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:80/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 300s
    deploy:
      resources:
        reservations:
          devices:
            - driver: cdi
              capabilities: ["gpu"]
              device_ids: ["nvidia.com/gpu=0"]

  # Generation. See risk R1: this model is hybrid Gated DeltaNet + MoE and
  # llama.cpp's support for that architecture is young, so it is smoke-tested
  # for coherence before anything is built on it.
  llm:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda-b11206
    # Pinned to a build tag, not the floating `server-cuda`: llama.cpp ships
    # several builds an hour, and the floating tag resolves to a different
    # digest again. b11206 is the highest server-cuda image published.
    profiles: ["models"]
    restart: unless-stopped
    logging: *default-logging
    command:
      # Flag and value are SEPARATE tokens, never --flag=value: llama.cpp's
      # argument parser normalises underscores to hyphens across the whole
      # token, so `--model=...Q4_K_XL.gguf` arrives as `...Q4-K-XL.gguf` and
      # the server dies on a file that does not exist.
      - "--model"
      - "/models/${LLM_GGUF_FILE:-Qwen3.5-9B-UD-Q4_K_XL.gguf}"
      # Binds loopback by default, which is unreachable from other containers.
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      # NEVER the model's native 262144. Reranked retrieval puts 6-10 sections
      # into context, so 16k is ample, and the VRAM budget has no room for more.
      - "--ctx-size"
      - "${LLM_CTX_SIZE:-16384}"
      - "--n-gpu-layers"
      - "999"
      # Buys back roughly a gigabyte of KV cache at this context length.
      - "--cache-type-k"
      - "q8_0"
      - "--cache-type-v"
      - "q8_0"
      - "--flash-attn"
      - "auto"
      # Qwen3.5 reasons by default. Left on, every answer arrives wrapped in
      # <think> and latency multiplies -- neither of which suits a consultant
      # that must quote retrieved text. (--chat-template-kwargs still works but
      # the server deprecates it in favour of this.)
      - "--reasoning"
      - "off"
    environment:
      TZ: ${TZ:-Etc/UTC}
    volumes:
      # Read-only: the server has no business writing to the weights.
      - models:/models:ro
    networks:
      - backend
    healthcheck:
      # `sh` here is dash, which has no /dev/tcp, but curl is present.
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 300s
    deploy:
      resources:
        reservations:
          devices:
            - driver: cdi
              capabilities: ["gpu"]
              device_ids: ["nvidia.com/gpu=0"]

networks:
  # Corpus, models and identity. Not marked `internal` because the pipeline
  # fetches from CORDIS and the model servers pull weights from HuggingFace.
  backend:
  # Caddy and Authelia only, so the reverse proxy cannot reach the database
  # directly even if it is compromised.
  edge:

volumes:
  # Named after the project, so `docker volume ls | grep gcr_` separates this
  # project's state from the other projects already on this machine -- which
  # is how the phase 11 cleanliness audit works.
  pgdata:
  hf_cache:
  models:
  lldap_data:
  caddy_data:
  caddy_config:
